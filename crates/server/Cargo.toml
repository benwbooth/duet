[package]
name = "duet-server"
description = "duet library server: scanning, reading, sync, downloads and AI jobs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "duet"
path = "src/main.rs"

[dependencies]
duet-common.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
epub = "2"
kuchikiki = "0.8.9-speedreader"
lofty = "0.25"
mime_guess = "2"
quick-xml = { version = "0.38", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "cookies", "stream"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
urlencoding = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
libc = "0.2"
tower = { version = "0.5", features = ["util"] }
imagesize = "0.13"
dom_smoothie = "0.19"
sha1_smol = "1"
