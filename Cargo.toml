[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/benwbooth/duet"

[workspace.dependencies]
duet-common = { path = "crates/common" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Size-optimized build for the WebAssembly UI only.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# One build for everything: devloop (the app you run), cargo run, cargo test
# and the editor all use this profile, so they share target/debug. It's
# release-grade (optimized, no debug info) and stays incremental, so a small
# change rebuilds in seconds. `cargo build --release` is only for packaging.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = true

# The web UI as devloop builds it (crates/web/build.sh): optimized but incremental,
# with no LTO, so a change to the UI rebuilds in seconds, not minutes.
# (Packaging, in flake.nix, still uses wasm-release.)
[profile.wasm-dev]
inherits = "dev"
opt-level = "s"
strip = true
codegen-units = 256
incremental = true
panic = "abort"
